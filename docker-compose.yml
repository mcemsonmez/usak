services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usak
      POSTGRES_PASSWORD: usak
      POSTGRES_DB: usak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
